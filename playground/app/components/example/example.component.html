<div class="zoom-pan-toolbar">
  <button
      mat-icon-button
      matTooltip="Zoom in one step — zoomIn()"
      (click)="zoomIn()">
    <mat-icon>
      zoom_in
    </mat-icon>
  </button>
  <button
      mat-icon-button
      matTooltip="Zoom out one step — zoomOut()"
      (click)="zoomOut()">
    <mat-icon>
      zoom_out
    </mat-icon>
  </button>
  <span class="separator"></span>
  <button
      mat-icon-button
      matTooltip="Scale the content to fill the width of the view, anchored top left — fit()"
      (click)="fit()">
    <mat-icon>
      fit_screen
    </mat-icon>
  </button>
  <button
      mat-icon-button
      matTooltip="Restore the default zoom and position — reset()"
      (click)="reset()">
    <mat-icon>
      restart_alt
    </mat-icon>
  </button>
  <span class="separator"></span>
  <span
      class="scale"
      matTooltip="Current zoom level — scale / (zoomed) output">
    {{ scaleLabel }}
  </span>
</div>
<div #zoomPanContaner>
  <fs-zoom-pan
      [zoomDefault]=".25"
      [zoomFactor]=".2"
      [zoomMax]="10"
      [zoomFit]="true"
      (zoomed)="zoomed($event)"
      (moved)="moved($event)">
